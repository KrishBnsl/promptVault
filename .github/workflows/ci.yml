name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov=core --cov-report=term-missing --cov-fail-under=80
      - run: uv build --wheel
      - run: uvx --from ./dist/pvlt-*.whl promptctl --help
      - run: docker build -t pvlt:test .
