version: "3.8"

services:
  pvlt-api:
    build: .
    command: serve --http --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PROMPTVAULT_DB_PATH=/app/data/promptvault.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped

  pvlt-web:
    build: .
    command: web --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    depends_on:
      - pvlt-api
    environment:
      - PROMPTVAULT_DB_PATH=/app/data/promptvault.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
