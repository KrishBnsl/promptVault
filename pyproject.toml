[project]
name = "promptvault"
version = "0.1.0"
description = "Open-source prompt versioning, evaluation, and management as an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["prompts", "llm", "mcp", "evaluation", "versioning", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "typer[all]>=0.9",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "openai>=1.0",
    "anthropic>=0.18",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "mcp>=1.0",
    "pydantic-settings>=2.0",
    "google-genai>=2.19.0",
]

[project.urls]
Homepage = "https://github.com/KrishBnsl/promptVault"
Documentation = "https://krishbnsl.github.io/promptVault/"
Repository = "https://github.com/KrishBnsl/promptVault"
Issues = "https://github.com/KrishBnsl/promptVault/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
promptctl = "cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
